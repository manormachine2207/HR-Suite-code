<!-- No [navigation]: the global module-tab bar is gone (ADR-014 navigation
     precision, 2026-06-12). Dashboard ('/') is the sole hub, the tiles are the
     navigation; back to the hub is the federal-logo brand link (homePageRoute '/'
     set in app.ts) + the per-page <app-breadcrumb>. The header keeps the
     brand logo, product name + version, dev role switcher, help icon, language menu. -->
<ob-master-layout>
  <!-- Official Oblique header-title slot: ob-master-layout projects [obHeaderTitle]
       into the brand link next to the federal logo (ObMasterLayoutComponent ng-content
       selector "[obHeaderTitle]"). Product name + release version from runtime.json. -->
  <span obHeaderTitle class="hr-header-title">
    {{ 'app.title' | translate }}
    <span class="hr-version-badge">{{ version }}</span>
  </span>
  <!-- ADR-016: dev role switcher as Oblique header control, next to the language
       switcher. The template must stay unconditional (ob-master-layout queries
       #obHeaderControl with descendants:false — wrapping it in @if would hide it
       from the content query); the component itself renders NOTHING unless
       runtime.json carries an enabled devAuth block, so prod gets an empty slot. -->
  <ng-template #obHeaderControl>
    <app-dev-role-switcher />
  </ng-template>
  <!-- ADR-017 Stufe 2: in-app notification bell as Oblique header control. Polls the
       unread count; renders nothing visible when empty (badge hidden at 0). -->
  <ng-template #obHeaderControl>
    <app-notification-bell />
  </ng-template>
  <!-- ADR-015: help entry as Oblique header control. #obHeaderControl templates are
       projected by ob-master-layout into the service-navigation list, i.e. next to
       the language switcher. data-tour anchors the final dashboard-tour step. -->
  <ng-template #obHeaderControl>
    <a routerLink="/hilfe" class="hr-header-help" data-tour="header-help"
       [attr.aria-label]="'help.headerAria' | translate"
       [title]="'help.headerAria' | translate">
      <mat-icon svgIcon="question_circle" aria-hidden="true" />
    </a>
  </ng-template>
  <router-outlet />
</ob-master-layout>
